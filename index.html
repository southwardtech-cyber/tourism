    dbGet('state', 'sound')
  ]).then(function (r) {

    SOUND.pref = r[7] === 'on' || r[7] === 'off' ? r[7] : null;
    S.notes = {};
    r[3].forEach(function (n) { S.notes[n.id] = n; });
    S.media = r[4].sort(function (a, b) { return a.t - b.t; });

/* ================= mini-map ================= */
var SVGNS = 'http://www.w3.org/2000/svg';
var HERO = MUSEUM.hero;
function colX(c) { return 6 + c * 34 + (c >= HERO.cols / 2 ? 4 : 0); }
function rowY(r) { return 6 + r * 24; }
function svgEl(name, attrs) {
  var e = document.createElementNS(SVGNS, name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function addCellRect(g, id, c, r) {
  var rect = svgEl('rect', {
    x: colX(c), y: rowY(r), width: 32, height: 22,
    'class': 'cell', 'vector-effect': 'non-scaling-stroke'
  });
  rect.style.setProperty('--c', c);
  rect.id = 'c-' + id;
  g.appendChild(rect);
  return rect;
}
var mmGrid = null;
var MORPH = { p:-1, active:false, raf:0, hanPts:null, tangPts:null, els:{} };
function rectPts(x, y, w, h) {
  /* 与汉城 16 顶点同一走向：西南起，西墙北上 → 北墙东行 → 东墙南下 → 南墙西行 */
  return [
    [x, y + h], [x, y + h * .75], [x, y + h * .5], [x, y + h * .25],
    [x, y], [x + w * .25, y], [x + w * .5, y], [x + w * .75, y],
    [x + w, y], [x + w, y + h * .25], [x + w, y + h * .5], [x + w, y + h * .75],
    [x + w, y + h], [x + w * .75, y + h], [x + w * .5, y + h], [x + w * .25, y + h]
  ];
}
function ptsD(pts) {
  return 'M' + pts.map(function (q) { return q[0] + ' ' + q[1]; }).join('L') + 'Z';
}
function buildMinimap() {
  var mm = $('#mm');
  var W = colX(HERO.cols - 1) + 32 + 6;
  var H = rowY(HERO.rows - 1) + 22 + 6;
  mm.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var g = svgEl('g', {});
  mmGrid = g;
  mm.appendChild(g);
  var P = HERO.palace;
  var MO = HERO.morph;
  var tangPts = rectPts(2.5, 2.5, W - 5, H - 5);
  /* 叠印幽灵层：两城真实足迹，过渡中段才显形 */
  var gGhost = null, gHan = null;
  if (MO) {
    gGhost = svgEl('g', {});
    gGhost.style.opacity = '0';
    gGhost.appendChild(svgEl('path', { d:ptsD(MO.han), 'class':'ghost', 'vector-effect':'non-scaling-stroke' }));
    gGhost.appendChild(svgEl('path', { d:ptsD(tangPts), 'class':'ghost', 'vector-effect':'non-scaling-stroke' }));
    g.appendChild(gGhost);
    gHan = svgEl('g', {});
    MO.hanRects.forEach(function (rc) {
      gHan.appendChild(svgEl('rect', { x:rc[0], y:rc[1], width:rc[2], height:rc[3], 'class':'pal', 'vector-effect':'non-scaling-stroke' }));
    });
    g.appendChild(gHan);
  }
  var gTang = svgEl('g', {});
  gTang.appendChild(svgEl('rect', {
    x:colX(P[0]), y:rowY(P[2]),
    width:colX(P[1]) + 32 - colX(P[0]), height:rowY(P[3]) + 22 - rowY(P[2]),
    'class':'pal', 'vector-effect':'non-scaling-stroke'
  }));
  var axisX = (colX(HERO.cols / 2 - 1) + 32 + colX(HERO.cols / 2)) / 2;
  gTang.appendChild(svgEl('line', { x1:axisX, y1:rowY(P[3]) + 22, x2:axisX, y2:H - 3, 'class':'axis', 'vector-effect':'non-scaling-stroke' }));
  g.appendChild(gTang);
  var wall = svgEl('path', { d:ptsD(MO ? MO.han : tangPts), 'class':'wall', 'vector-effect':'non-scaling-stroke' });
  g.appendChild(wall);
  MORPH.hanPts = MO ? MO.han : null;
  MORPH.tangPts = tangPts;
  MORPH.els = { wall:wall, han:gHan, tang:gTang, ghost:gGhost };
  var cellOf = {};
  for (var id in HERO.cells) cellOf[HERO.cells[id][0] + ',' + HERO.cells[id][1]] = id;
  for (var r = 0; r < HERO.rows; r++) {
    for (var c = 0; c < HERO.cols; c++) {
      if (r >= P[2] && r <= P[3] && c >= P[0] && c <= P[1]) continue;
      var eid = cellOf[c + ',' + r];
      if (eid) { addCellRect(g, eid, c, r); continue; }
      var rect = svgEl('rect', {
        x:colX(c), y:rowY(r), width:32, height:22,
        'class':'cell', 'vector-effect':'non-scaling-stroke'
      });
      rect.style.setProperty('--c', c);
      g.appendChild(rect);
    }
  }
  S.custom.forEach(function (x) { if (x.cell) addCellRect(g, x.id, x.cell[0], x.cell[1]); });
}
function nextSpare() {
  var used = S.custom.filter(function (x) { return x.cell; }).length;
  return HERO.spare[used] || null;
}

/* ================= 两座长安（7.1）滚动插值 =================
   A 区在视野内=汉长安（斗城居西北），滚进 B 区=城墙 16 顶点插值展开成唐城棋盘，
   中段两城足迹叠印。IntersectionObserver 门控被动 scroll 监听，不用 scroll-timeline。 */
var RM_Q = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
function morphD(t) {
  var pts = MORPH.hanPts.map(function (h, i) {
    var g = MORPH.tangPts[i];
    return [(h[0] + (g[0] - h[0]) * t).toFixed(1), (h[1] + (g[1] - h[1]) * t).toFixed(1)];
  });
  return 'M' + pts.map(function (q) { return q[0] + ' ' + q[1]; }).join('L') + 'Z';
}
function applyMorph(p) {
  var e = MORPH.els;
  if (!e.wall || !MORPH.hanPts) return;
  p = Math.max(0, Math.min(1, p));
  if (RM_Q && RM_Q.matches) p = p < 0.5 ? 0 : 1;   // 减少动效：只取两端，不给中间态
  if (Math.abs(p - MORPH.p) < 0.004) return;
  MORPH.p = p;
  e.wall.setAttribute('d', morphD(p));
  e.wall.style.opacity = (0.45 + 0.55 * Math.abs(2 * p - 1)).toFixed(3);
  e.han.style.opacity = Math.max(0, 1 - p / 0.4).toFixed(3);
  e.tang.style.opacity = Math.max(0, (p - 0.6) / 0.4).toFixed(3);
  e.ghost.style.opacity = (Math.sin(Math.PI * p) * 0.4).toFixed(3);
  $('#mm').style.setProperty('--cellfade', (0.3 + 0.7 * p).toFixed(3));
}
function morphScroll() {
  if (MORPH.raf) return;
  MORPH.raf = requestAnimationFrame(function () {
    MORPH.raf = 0;
    var zb = $('#z-B');
    if (!zb) return;
    var top = zb.getBoundingClientRect().top;
    var hdB = $('#hd').getBoundingClientRect().bottom;
    var span = Math.min(360, window.innerHeight * 0.5);
    applyMorph((hdB + span - top) / span);
  });
}
function bindMorphDriver() {
  if (!MORPH.hanPts) return;
  var za = $('#z-A');
  if (!za || !('IntersectionObserver' in window)) { applyMorph(1); return; }
  var io = new IntersectionObserver(function (ents) {
    var e = ents[0];
    if (e.isIntersecting) {
      if (!MORPH.active) {
        MORPH.active = true;
        window.addEventListener('scroll', morphScroll, { passive:true });
      }
      morphScroll();
    } else {
      if (MORPH.active) {
        MORPH.active = false;
        window.removeEventListener('scroll', morphScroll);
      }
      applyMorph(e.boundingClientRect.bottom <= 0 ? 1 : 0);
    }
  });
  io.observe(za);
  morphScroll();
}

function updateCounts() {
  var n = Object.keys(S.checks).length;

  MUSEUM.blocks.concat([{ id:MUSEUM.customBlock.id, items:S.custom }]).forEach(function (z) {

  var fn = Object.keys(S.found).length;
  $('#insbadge').textContent = fn ? fn + '/' + MUSEUM.insights.length : '';
  $('#insheadsm').textContent = '找到 ' + fn + '/' + MUSEUM.insights.length + ' · 集齐三件今天就算值了';

function applyFilters() {
  var any = false, t;
  for (t in S.filters) { any = true; break; }
  $$('#list [data-tags]').forEach(function (el) {
    var hit = !any;
    if (any) {
      var tags = el.getAttribute('data-tags').split(',');
      for (var j = 0; j < tags.length; j++) {

/* ================= 输入层：照片 ================= */
var photoTarget = null;      // 条目 id 或 '@form'（自由条目暂存）
var formPending = [];        // {blob, thumb, url}
function loadImg(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { res({ img:img, url:url }); };
    img.onerror = function (e) { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
function cvBlob(cv, q) {
  return new Promise(function (res, rej) {
    cv.toBlob(function (b) { b ? res(b) : rej(new Error('toBlob null')); }, 'image/jpeg', q);
  });
}
function processPhoto(file) {
  return loadImg(file).then(function (r) {
    var W = r.img.naturalWidth, H = r.img.naturalHeight;
    var sc = Math.min(1, 1600 / Math.max(W, H));
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(W * sc));
    cv.height = Math.max(1, Math.round(H * sc));
    cv.getContext('2d').drawImage(r.img, 0, 0, cv.width, cv.height);
    var T = 192, tc = document.createElement('canvas');
    tc.width = T; tc.height = T;
    var s = Math.max(T / cv.width, T / cv.height);
    tc.getContext('2d').drawImage(cv, (T - cv.width * s) / 2, (T - cv.height * s) / 2, cv.width * s, cv.height * s);
    URL.revokeObjectURL(r.url);
    return Promise.all([cvBlob(cv, 0.82), cvBlob(tc, 0.7)]).then(function (bs) {
      return { blob: bs[0], thumb: bs[1] };
    });
  });
}
function renderThumbs(id) {
  var box = $('#th-' + id);
  if (!box) return;
  var out = [];
  S.media.forEach(function (m) {
    if (m.item !== id) return;
    if (m.kind === 'photo') {
      if (!mediaURL[m.id]) mediaURL[m.id] = URL.createObjectURL(m.thumb || m.blob);
      out.push('<button class="th" data-cmd="view" data-mid="' + m.id + '" style="background-image:url(' + mediaURL[m.id] + ')" aria-label="查看照片"></button>');
    } else {
      out.push('<div class="au" data-mid="' + m.id + '">' +
        '<button class="aup" data-cmd="play" data-mid="' + m.id + '">' + IC.play + IC.stop + '<span>' + durfmt(m.dur || 0) + '</span></button>' +
        '<button class="aux" data-cmd="delau" data-mid="' + m.id + '" aria-label="删除语音">' + IC.x + '</button></div>');
    }
  });
  box.innerHTML = out.join('');
  var meta = $('#meta-' + id);
  if (meta && ITEMS[id]) meta.innerHTML = tagSpans(ITEMS[id]) + userMarks(id);
  if (meta && !ITEMS[id]) meta.innerHTML = '<span class="tg-tre">自建</span>' + userMarks(id);
}
function onPhotoPicked(files) {
  var arr = Array.prototype.slice.call(files || []);
  if (!arr.length || !photoTarget) return;
  var target = photoTarget;
  var jobs = arr.map(function (f) { return processPhoto(f); });
  Promise.all(jobs).then(function (rs) {
    if (target === '@form') {
      rs.forEach(function (r) {
        r.url = URL.createObjectURL(r.thumb);
        formPending.push(r);
      });
      renderFormPending();
      return;
    }
    var t = Date.now();
    return Promise.all(rs.map(function (r) {
      var rec = { item: target, kind: 'photo', blob: r.blob, thumb: r.thumb, t: t };

var rec = null; // {mr, chunks, item, t0, timer, stream, released}
function startRec(item, btn) {
  if (rec) return;
  var my = { item:item, btn:btn, chunks:[], t0:0, released:false };
  rec = my;
  /* 权限弹窗一直没答复时，别让语音按钮永久卡死 */
  var guard = setTimeout(function () {
    if (rec === my && !my.mr) {
      rec = null;
      toast('麦克风没响应——检查系统权限后再试');
    }
  }, 8000);
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function (stream) {
    clearTimeout(guard);
    if (rec !== my) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
    if (my.released) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      rec = null;
      toast('麦克风已就绪——按住「语音」开始说');
      return;
    }
    var mr;
    try {
      mr = new MediaRecorder(stream, { mimeType: MIC_MIME });
    } catch (err) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      rec = null;
      toast('录音器启动失败（' + MIC_MIME + '）——这条先用笔记记吧');
      return;
    }
    my.mr = mr; my.stream = stream; my.t0 = Date.now();
    mr.ondataavailable = function (e) { if (e.data && e.data.size) my.chunks.push(e.data); };
    /* 整段录，不用 timeslice：iOS Safari 分片 mp4 拼接后不可播放 */
    mr.start();
    btn.classList.add('rec');
    $('#recpill').hidden = false;
    $('#rectime').textContent = '0:00';
    my.timer = setInterval(function () {
      if (my.t0) $('#rectime').textContent = durfmt(Date.now() - my.t0);
      if (my.t0 && Date.now() - my.t0 > 120000) stopRec();
    }, 250);
  }).catch(function () {
    clearTimeout(guard);
    if (rec === my) rec = null;
    toast('用不了麦克风——需要 https 或本地打开，并允许权限');
  });
}
function stopRec() {
  if (!rec) return;
  var r = rec;
  if (!r.mr) { r.released = true; return; }
  rec = null;
  clearInterval(r.timer);
  r.btn.classList.remove('rec');
  $('#recpill').hidden = true;
  var dur = Date.now() - r.t0;
  r.mr.onstop = function () {
    r.stream.getTracks().forEach(function (t) { t.stop(); });
    if (dur < 600 || !r.chunks.length) { toast('太短了，没存'); return; }
    var blob = new Blob(r.chunks, { type: r.mr.mimeType || MIC_MIME });
    var t = Date.now();
    var recd = { item:r.item, kind:'audio', blob:blob, mime:blob.type, dur:dur, t:t };
    dbPut('media', recd).then(function (key) {
      recd.id = key;
      S.media.push(recd);
      renderThumbs(r.item);
      toast('语音已存 · ' + durfmt(dur));
    });
  };
  try { r.mr.stop(); } catch (e) { r.stream.getTracks().forEach(function (t) { t.stop(); }); }
}
var player = new Audio();
var playingMid = null;
player.addEventListener('ended', function () { markPlaying(null); });
player.addEventListener('error', function () {
  if (playingMid == null) return;
  markPlaying(null);
  toast('这条录音本机解不了码——可能是在别的设备上录的');
});
function markPlaying(mid) {
  if (playingMid != null) {
    var old = $('.au[data-mid="' + playingMid + '"]');
    if (old) old.classList.remove('playing');
  }
  playingMid = mid;
  if (mid != null) {
    var el = $('.au[data-mid="' + mid + '"]');
    if (el) el.classList.add('playing');
  }
}
function playAudio(mid) {
  if (playingMid === mid) { player.pause(); markPlaying(null); return; }
  var m = S.media.filter(function (x) { return x.id === mid; })[0];
  if (!m) return;
  var mime = m.mime || (m.blob && m.blob.type) || '';
  if (mime && player.canPlayType && player.canPlayType(mime) === '') {
    toast('这条录音（' + mime + '）本机放不了——可能是在别的设备上录的');
    return;
  }
  if (!mediaURL[mid]) mediaURL[mid] = URL.createObjectURL(m.blob);
  player.src = mediaURL[mid];
  markPlaying(mid);
  player.play().catch(function () { markPlaying(null); });
}

/* ================= 钟声（7.3 雁塔晨钟 · Web Audio 合成） =================
   零音频文件。铜钟音色的来源是分音不成整数比：hum 0.5×、tierce 1.19×、
   quint 1.56×、2.66× 等，加一对微失谐分音产生大钟的慢拍频。
   打勾一记极短；集齐三件反直觉一记长的带混响；全馆点亮三记。
   默认静音，首次打勾问一次。 */
var SOUND = { pref:null, ctx:null, conv:null, master:null };
var BELL_PARTIALS = [
  [0.5,   0.9, 1.9],
  [1.0,   1.0, 1.0],
  [1.003, 0.6, 1.0],
  [1.19,  0.55, 0.55],
  [1.56,  0.35, 0.4],
  [2.0,   0.3, 0.3],
  [2.66,  0.18, 0.2],
  [3.36,  0.1, 0.12]
];
var bellIdleTimer = null;
function soundCtx() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!SOUND.ctx) {
    SOUND.ctx = new AC();
    SOUND.master = SOUND.ctx.createGain();
    SOUND.master.connect(SOUND.ctx.destination);
    /* 程序生成的脉冲响应：双声道指数衰减噪声，轻低通让尾音发暗 */
    var sr = SOUND.ctx.sampleRate, len = Math.floor(sr * 1.6);
    var ir = SOUND.ctx.createBuffer(2, len, sr);
    for (var ch = 0; ch < 2; ch++) {
      var d = ir.getChannelData(ch), lp = 0;
      for (var i = 0; i < len; i++) {
        lp += 0.12 * ((Math.random() * 2 - 1) - lp);
        d[i] = lp * Math.pow(1 - i / len, 2.2);
      }
    }
    SOUND.conv = SOUND.ctx.createConvolver();
    SOUND.conv.buffer = ir;
    var wet = SOUND.ctx.createGain();
    wet.gain.value = 0.5;
    SOUND.conv.connect(wet);
    wet.connect(SOUND.master);
  }
  if (SOUND.ctx.state === 'suspended') SOUND.ctx.resume();
  return SOUND.ctx;
}
function scheduleBellIdle(tailSec) {
  clearTimeout(bellIdleTimer);
  bellIdleTimer = setTimeout(function () {
    if (SOUND.ctx && SOUND.ctx.state === 'running') SOUND.ctx.suspend();
  }, (tailSec + 2) * 1000);
}
function strike(vol, dur, reverb, when) {
  if (SOUND.pref !== 'on') return;
  var ctx = soundCtx();
  if (!ctx) return;
  var t0 = ctx.currentTime + (when || 0) + 0.01;
  var bus = ctx.createGain();
  bus.connect(SOUND.master);
  if (reverb) bus.connect(SOUND.conv);
  var f0 = 196;
  BELL_PARTIALS.forEach(function (p) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f0 * p[0];
    var g = ctx.createGain();
    var pk = Math.max(0.0002, vol * p[1]);
    var pdur = Math.max(0.08, dur * p[2]);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(pk, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(pk * 0.001, t0 + pdur);
    o.connect(g);
    g.connect(bus);
    o.start(t0);
    o.stop(t0 + pdur + 0.05);
  });
  /* 敲击接触的一瞬：20ms 带通噪声 */
  var nlen = Math.floor(ctx.sampleRate * 0.02);
  var nb = ctx.createBuffer(1, nlen, ctx.sampleRate);
  var nd = nb.getChannelData(0);
  for (var i = 0; i < nlen; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nlen);
  var ns = ctx.createBufferSource();
  ns.buffer = nb;
  var nf = ctx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = f0 * 2.6;
  nf.Q.value = 1.2;
  var ng = ctx.createGain();
  ng.gain.value = vol * 0.7;
  ns.connect(nf);
  nf.connect(ng);
  ng.connect(bus);
  ns.start(t0);
}
function bellCheck() { strike(0.05, 0.25, false, 0); scheduleBellIdle(1); }
function bellThree() { strike(0.11, 3.2, true, 0); scheduleBellIdle(5); }
function bellAll() {
  strike(0.10, 2.2, true, 0);
  strike(0.10, 2.2, true, 0.8);
  strike(0.11, 3.2, true, 1.6);
  scheduleBellIdle(7);
}

/* ================= 层栈：返回手势接管 =================
   每开一层（抽屉/灯箱/条目展开）pushState 一条；popstate 关最上层。
   iOS 边缘右滑 = 关当前层，不会退出应用。
   界面上主动关 = 先做视觉关闭，再 suppressPop+history.back() 消掉对应记录。 */
var layers = [];        // {kind:'sheet'|'lb'|'item'|'noop', id}
var suppressPop = 0;
function pushLayer(kind, id) {
  layers.push({ kind:kind, id:id });
  try { history.pushState({ mguide:layers.length }, ''); } catch (e) {}
}
function popLayerViaUI() {
  if (!layers.length) return;
  layers.pop();
  suppressPop++;
  try { history.back(); } catch (e) { suppressPop--; }
}
function markLayerNoop(kind, id) {
  for (var i = layers.length - 1; i >= 0; i--) {
    if (layers[i].kind === kind && layers[i].id === id) { layers[i] = { kind:'noop' }; return; }
  }
}
function repurposeTopLayer(kind, id) {
  if (layers.length) layers[layers.length - 1] = { kind:kind, id:id };
  else pushLayer(kind, id);
}
window.addEventListener('popstate', function () {
  if (suppressPop > 0) { suppressPop--; return; }
  var top = layers.pop();
  if (!top) return;
  if (top.kind === 'sheet') visualCloseSheet();
  else if (top.kind === 'lb') visualCloseLightbox();
  else if (top.kind === 'item') visualCollapseItem(top.id);
});

var curSheet = null, scrollLocked = false, lockY = 0, leavingTimer = null;
function lockScroll() {
  if (scrollLocked) return;
  scrollLocked = true;
  lockY = window.scrollY || 0;
  var b = document.body;
  b.style.position = 'fixed';
  b.style.top = -lockY + 'px';
  b.style.left = '0';
  b.style.right = '0';
  b.style.width = '100%';
}
function unlockScroll() {
  if (!scrollLocked) return;

  b.style.position = '';
  b.style.top = '';
  b.style.left = '';
  b.style.right = '';
  b.style.width = '';

}
function finishCloseSheet(name) {

function visualOpenSheet(name) {

    clearTimeout(leavingTimer);

    ['qref', 'search', 'ins', 'mine'].forEach(function (n) {

    });

function openSheet(name) {
  if (curSheet === name) return;

    /* 抽屉间切换：复用同一条历史记录 */
    visualCloseSheet();

  }

/* ================= 抽屉下拉关闭（跟手） ================= */
function bindSheetDrag() {
  $$('.sheet').forEach(function (sh) {
    var p = $('.panel', sh), sb = $('.sbody', sh), veil = $('.veil', sh);
    var sy = 0, sx = 0, dy = 0, dragging = false, may = false, H = 1;
    p.addEventListener('touchstart', function (e) {
      if (!sh.classList.contains('on')) return;
      var t = e.touches[0];
      sy = t.clientY; sx = t.clientX; dy = 0; dragging = false;
      H = p.offsetHeight || 1;
      may = !(sb && sb.contains(e.target) && sb.scrollTop > 0);
    }, { passive:true });
    p.addEventListener('touchmove', function (e) {
      if (!may) return;
      var t = e.touches[0];
      var ddy = t.clientY - sy, ddx = t.clientX - sx;
      if (!dragging) {
        if (ddy > 8 && ddy > Math.abs(ddx)) {
          dragging = true;
          p.style.transition = 'none';
        } else if (Math.abs(ddx) > 10 || ddy < -8) { may = false; return; }
        else return;
      }
      e.preventDefault();
      dy = Math.max(0, ddy);
      p.style.transform = 'translateY(' + dy + 'px)';
      veil.style.opacity = String(Math.max(0, 1 - dy / H));
    }, { passive:false });
    function end() {
      if (!dragging) return;
      dragging = false;
      if (dy > H / 3) {
        requestCloseSheet();
      } else {
        p.style.transition = 'transform var(--dur) var(--ease)';
        p.style.transform = '';
        veil.style.opacity = '';
      }
    }
    p.addEventListener('touchend', end);
    p.addEventListener('touchcancel', end);
  });
}

/* ================= 搜索 =================
   汉字子串匹配全字段；纯字母输入额外匹配名称的拼音首字母（tkm → 腾空马）。 */
var IDX = [];

}
function buildIndex() {

function snippet(hay, q) {
  var i = hay.indexOf(q);
  if (i < 0) return '';
  var a = Math.max(0, i - 12);
  var pre = (a > 0 ? '…' : '') + hay.slice(a, i);
  var post = hay.slice(i + q.length, i + q.length + 24) + '…';
  return esc(pre) + '<b>' + esc(hay.substr(i, q.length)) + '</b>' + esc(post);
}
function renderSearch() {
  var q = $('#srchin').value.trim().toLowerCase();

    return;
  }

  var isAscii = /^[a-z0-9]+$/.test(q);
  var hits = IDX.filter(function (e) {
    if (e.hay.indexOf(q) >= 0) return true;
    return isAscii && e.pyi && e.pyi.indexOf(q) >= 0;
  }).slice(0, 40);
  if (!hits.length) {
    body.innerHTML = '<p class="snone">清单里没有——可能真不在展，也可能值得去「手记」里记一件。</p>';
    return;
  }
  body.innerHTML = hits.map(function (e) {
    var cmd, data;
    if (e.k === 'item') { cmd = 'jump'; data = e.id; }
    else if (e.k === 'ins') { cmd = e.link ? 'jump' : 'sheet-ins'; data = e.link || ''; }
    else { cmd = 'jumpq'; data = e.id; }
    var snip = snippet(e.hay, q);
    return '<button data-cmd="' + cmd + '" data-id="' + esc(data) + '">' +
      '<span class="rk">' + KN[e.k] + '</span><span class="rn">' + esc(e.nm) + '</span>' +
      (snip ? '<span class="rs">' + snip + '</span>' : '') + '</button>';
  }).join('');
}
function visualCollapseItem(id) {
  var li = $('#it-' + id);

function jumpToItem(id) {
  var li = $('#it-' + id);

  var hadSheet = !!curSheet;
  if (hadSheet) visualCloseSheet();
  var zone = li.closest('.zone');
  if (zone && zone.classList.contains('closed')) {
    zone.classList.remove('closed');
    $('.zhead', zone).setAttribute('aria-expanded', 'true');
  }
  var wasOpen = li.classList.contains('open');
  li.classList.add('open');
  $('.it-hd', li).setAttribute('aria-expanded', 'true');
  /* 历史记录记账：抽屉那条记录转给展开的条目 */
  if (hadSheet) {
    if (!wasOpen) repurposeTopLayer('item', id);
    else popLayerViaUI();

    pushLayer('item', id);

    li.classList.add('flash');
  }, 60);
}

function deleteCustom(id) {
  if (!confirm('删掉这条和它的照片、笔记？')) return;
  var rec = S.custom.filter(function (x) { return x.id === id; })[0];
  S.custom = S.custom.filter(function (x) { return x.id !== id; });
  var jobs = [dbDel('custom', id), dbDel('notes', id)];
  delete S.notes[id];
  S.media.filter(function (m) { return m.item === id; }).forEach(function (m) {
    if (mediaURL[m.id]) { URL.revokeObjectURL(mediaURL[m.id]); delete mediaURL[m.id]; }
    jobs.push(dbDel('media', m.id));
  });
  S.media = S.media.filter(function (m) { return m.item !== id; });
  S.doubts.filter(function (d) { return d.item === id; }).forEach(function (d) { jobs.push(dbDel('doubts', d.id)); });
  S.doubts = S.doubts.filter(function (d) { return d.item !== id; });
  if (S.checks[id]) { delete S.checks[id]; jobs.push(dbPut('state', S.checks, 'checks')); }
  var cell = $('#c-' + id);
  if (cell) cell.parentNode.removeChild(cell);
  Promise.all(jobs).then(function () {
    if (rec) toast('删了「' + rec.nm + '」');
    renderCustomZone();
    buildIndex();
  });
}

function collectMediaB64() {
  return Promise.all(S.media.map(function (m) {
    return blobDataURL(m.blob).then(function (u) {
      return { id:m.id, item:m.item, kind:m.kind, mime:m.blob.type, dur:m.dur || 0, t:m.t, data:u };
    });
  }));
}
function backupData(withMedia) {
  var base = {
    app:'mguide', v:1,
    museum:{ name:MUSEUM.name, date:MUSEUM.date },
    exported:Date.now(),
    checks:S.checks, found:S.found,
    notes:S.notes,
    doubts:S.doubts,
    custom:S.custom
  };
  if (!withMedia) return Promise.resolve(base);
  return collectMediaB64().then(function (ms) { base.media = ms; return base; });
}
function saveBlob(blob, name) {
  var f = null;
  try { f = new File([blob], name, { type: blob.type }); } catch (e) {}
  if (IS_IOS && f && navigator.canShare && navigator.canShare({ files:[f] }) && navigator.share) {
    navigator.share({ files:[f] }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      anchorSave(blob, name);
    });
    return;
  }
  anchorSave(blob, name);
}
function anchorSave(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);

  setTimeout(function () {
    URL.revokeObjectURL(a.href);
    a.parentNode.removeChild(a);
  }, 4000);
}

function buildJournal() {
  return collectMediaB64().then(function (ms) {
    var byItem = {};
    ms.forEach(function (m) { (byItem[m.item] = byItem[m.item] || []).push(m); });
    var nChecked = Object.keys(S.checks).length;
    var nPhoto = ms.filter(function (m) { return m.kind === 'photo'; }).length;
    var nAudio = ms.length - nPhoto;
    var nNote = Object.keys(S.notes).filter(function (k) { return S.notes[k].text; }).length;
    var h = [];
    h.push('<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">');
    h.push('<meta name="viewport" content="width=device-width, initial-scale=1">');
    h.push('<title>参观志 · ' + esc(MUSEUM.name) + ' · ' + esc(MUSEUM.dateLabel) + '</title>');
    h.push('<style>' + JCSS + '</style></head><body>');
    h.push('<header><h1>' + esc(MUSEUM.name) + ' · 参观志</h1>');
    h.push('<p class="sub">' + esc(MUSEUM.dateLabel) + ' · ' + esc(MUSEUM.hours) + '</p>');
    h.push('<p class="stats">看过 ' + nChecked + '/' + TOTAL + ' 件 · 反直觉 ' + Object.keys(S.found).length + '/' + MUSEUM.insights.length +
      ' · 照片 ' + nPhoto + ' 张 · 语音 ' + nAudio + ' 条 · 笔记 ' + nNote + ' 条 · 疑问 ' + S.doubts.length + ' 个</p></header>');

    /* 动线 */
    var ev = [];
    Object.keys(S.checks).forEach(function (id) { ev.push({ t:S.checks[id], i:'✓', x:nameOf(id) }); });
    Object.keys(S.found).forEach(function (rid) {
      var r = INS_BY_ID[rid];
      ev.push({ t:S.found[rid], i:'☆', x:(r ? r.nm : rid) + '（反直觉）' });
    });
    S.doubts.forEach(function (d) { ev.push({ t:d.t, i:'？', x:d.nm + ' 存疑' }); });
    ms.forEach(function (m) { ev.push({ t:m.t, i:(m.kind === 'photo' ? '照' : '声'), x:nameOf(m.item) }); });
    S.custom.forEach(function (x) { ev.push({ t:x.t, i:'＋', x:'新记：' + x.nm }); });
    ev.sort(function (a, b) { return a.t - b.t; });
    if (ev.length) {
      h.push('<h2>动线 · 今天走过的顺序</h2>');
      ev.forEach(function (e) {
        h.push('<p class="ev"><time>' + tfmt(e.t) + '</time><i>' + e.i + '</i><span>' + esc(e.x) + '</span></p>');
      });
    }

    /* 反直觉收获 */
    var founds = Object.keys(S.found).map(function (rid) { return { rid:rid, t:S.found[rid] }; })
      .sort(function (a, b) { return a.t - b.t; });
    if (founds.length) {
      h.push('<h2>原来古代已经这样了 · 找到 ' + founds.length + ' 件</h2>');
      founds.forEach(function (f) {
        var r = INS_BY_ID[f.rid];
        if (!r) return;
        h.push('<div class="insb"><p class="s">' + esc(r.nm) + ' · 3 秒走过：' + esc(r.seem) + '</p>' +
          '<p class="tw">' + esc(r.twist) + '</p>' +
          '<p class="tmm">' + tfmt(f.t) + ' 现场验证：' + esc(r.act) + '</p></div>');
      });
    }

    /* 条目档案：有照片/语音/笔记/疑问的 */
    var rich = ORDER.concat(S.custom.map(function (x) { return x.id; })).filter(function (id) {
      return (byItem[id] && byItem[id].length) || (S.notes[id] && S.notes[id].text) ||
        S.doubts.some(function (d) { return d.item === id; });
    });
    if (rich.length) {
      h.push('<h2>逐件档案</h2>');
      rich.forEach(function (id) {
        h.push('<div class="itb"><h3>' + esc(nameOf(id)) + '</h3>');
        if (S.checks[id]) h.push('<p class="tm">' + tfmt(S.checks[id]) + ' 看过</p>');
        (byItem[id] || []).forEach(function (m) {
          if (m.kind === 'photo') h.push('<img src="' + m.data + '" alt="">');
          else h.push('<audio controls preload="none" src="' + m.data + '"></audio>');
        });
        if (S.notes[id] && S.notes[id].text) h.push('<p class="note">' + esc(S.notes[id].text) + '</p>');
        S.doubts.filter(function (d) { return d.item === id; }).forEach(function (d) {
          h.push('<p class="dq">？ ' + tfmt(d.t) + (d.txt ? ' · ' + esc(d.txt) : ' · 存疑待查') + '</p>');
        });
        h.push('</div>');
      });
    }

    /* 疑问队列 */
    if (S.doubts.length) {
      h.push('<h2>疑问队列 · 回家拿去问</h2>');
      S.doubts.forEach(function (d) {
        h.push('<div class="dql"><time>' + tfmt(d.t) + '</time>' + esc(d.nm) +
          (d.txt ? '<p class="x">' + esc(d.txt) + '</p>' : '') + '</div>');
      });
    }

    h.push('<footer><p>' + esc(MUSEUM.name) + ' · ' + esc(MUSEUM.dateLabel) +
      ' · 本文件自包含，照片与录音全部内嵌，不依赖任何服务、账号或网络。</p>' +
      '<p>文末内嵌当日数据备份（不含媒体），可导回导览工具。</p></footer>');
    return backupData(false).then(function (bk) {
      h.push('<script id="backup" type="application/json">' +
        JSON.stringify(bk).replace(/</g, '\\u003c') + '<\/script>');
      h.push('</body></html>');
      return h.join('\n');
    });
  });
}

function importJSON(file) {

    var stores = ['state', 'notes', 'media', 'doubts', 'custom'];
    Promise.all(stores.map(dbClear)).then(function () {
      var jobs = [];

      (bk.doubts || []).forEach(function (d) { delete d.id; jobs.push(dbPut('doubts', d)); });
      (bk.custom || []).forEach(function (x) { jobs.push(dbPut('custom', x)); });
      (bk.media || []).forEach(function (m) {
        var blob = dataURLBlob(m.data);
        var rec = { item:m.item, kind:m.kind, blob:blob, mime:m.mime, dur:m.dur, t:m.t };
        if (m.kind === 'photo') rec.thumb = blob;
        jobs.push(dbPut('media', rec));
      });
      return Promise.all(jobs);
    }).then(function () { location.reload(); });
  }).catch(function () { toast('这个文件读不了——要 mguide 的 JSON 备份'); });
}
function genSW() {
  anchorSave(new Blob([SW_SRC], { type:'text/javascript' }), 'sw.js');
  toast('已生成 sw.js——放到和本页同一目录后刷新');
}

/* ================= 全局命令 ================= */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-cmd]');
  if (!el) return;
  var cmd = el.getAttribute('data-cmd');
  var item = el.getAttribute('data-item');
  switch (cmd) {
    case 'check': toggleCheck(item); break;
    case 'expand': {
      var li = el.closest('.it');
      var iid = li.getAttribute('data-id');
      if (li.classList.contains('open')) {
        visualCollapseItem(iid);
        var topL = layers[layers.length - 1];
        if (topL && topL.kind === 'item' && topL.id === iid) popLayerViaUI();
        else markLayerNoop('item', iid);
      } else {
        li.classList.add('open');
        el.setAttribute('aria-expanded', 'true');
        pushLayer('item', iid);
      }
      break;
    }
    case 'zone': {
      var zone = el.closest('.zone');
      var closed = zone.classList.toggle('closed');
      el.setAttribute('aria-expanded', !closed);
      morphScroll();   // 折叠改变布局，刷新两座长安的插值进度
      break;
    }
    case 'photo': photoTarget = item; $('#photoIn').click(); break;
    case 'note': {
      var wrap = $('.notewrap[data-item="' + item + '"]');
      wrap.hidden = !wrap.hidden;
      if (!wrap.hidden) $('textarea', wrap).focus();
      break;
    }
    case 'doubt': addDoubt(item); break;
    case 'doubtok': {
      var dw = $('.doubtwrap[data-item="' + item + '"]');
      doubtText(item, $('input', dw).value.trim());
      break;
    }
    case 'found': toggleFound(el.getAttribute('data-rid')); break;
    case 'view': openLightbox(parseInt(el.getAttribute('data-mid'), 10)); break;
    case 'play': playAudio(parseInt(el.getAttribute('data-mid'), 10)); break;
    case 'delau': {
      var mid = parseInt(el.getAttribute('data-mid'), 10);
      var m = S.media.filter(function (x) { return x.id === mid; })[0];
      if (m && confirm('删掉这条语音？')) {
        if (playingMid === mid) { player.pause(); markPlaying(null); }
        if (mediaURL[mid]) { URL.revokeObjectURL(mediaURL[mid]); delete mediaURL[mid]; }
        S.media = S.media.filter(function (x) { return x.id !== mid; });
        dbDel('media', mid).then(function () { renderThumbs(m.item); });
      }
      break;
    }
    case 'xdel': deleteCustom(item); break;
    case 'sheet': openSheet(el.getAttribute('data-sheet')); break;
    case 'sheet-ins': openSheet('ins'); break;
    case 'close': requestCloseSheet(); break;
    case 'jump': jumpToItem(el.getAttribute('data-id')); break;
    case 'jumpq': {
      var qid = el.getAttribute('data-id');
      openSheet('qref');
      $('#qrefin').value = qid;
      filterQref(qid);
      break;
    }
    case 'newcustom': case 'newcustom-here': {
      if (curSheet !== 'mine') openSheet('mine');
      var slot = $('#xformslot');
      if (slot && !$('#xform')) { slot.innerHTML = xformHTML(); $('#xnm').focus(); }
      else if (slot) { slot.innerHTML = ''; formPending = []; }
      break;
    }
    case 'xphoto': photoTarget = '@form'; $('#photoIn').click(); break;
    case 'xsave': saveCustom(); break;
    case 'deldoubt': {
      var did = parseInt(el.getAttribute('data-did'), 10);
      var dd = S.doubts.filter(function (x) { return x.id === did; })[0];
      S.doubts = S.doubts.filter(function (x) { return x.id !== did; });
      dbDel('doubts', did).then(function () {
        if (dd) {
          renderThumbs(dd.item);
          var btn = $('#it-' + dd.item + ' .a-doubt');
          if (btn && !S.doubts.some(function (x) { return x.item === dd.item; })) btn.classList.remove('on');
        }
        renderMine();
        updateCounts();
      });
      break;
    }
    case 'bell-yes': setBellPref('on'); soundCtx(); bellCheck(); break;
    case 'bell-no': setBellPref('off'); break;
    case 'bell-toggle': {
      setBellPref(SOUND.pref === 'on' ? 'off' : 'on');
      renderMine();
      if (SOUND.pref === 'on') { soundCtx(); bellCheck(); }
      break;
    }
    case 'export-journal': exportJournal(); break;
    case 'export-json': exportJSON(); break;
    case 'import-json': $('#importIn').click(); break;
    case 'gen-sw': genSW(); break;
    case 'banner-ok': {
      $('#bannerslot').innerHTML = '';
      dbPut('state', true, 'seen');
      syncHd();
      break;
    }
    case 'lbclose': requestCloseLightbox(); break;
    case 'lbdel': lightboxDelete(); break;
  }
});

/* ================= 灯箱 ================= */
var lbMid = null;
function openLightbox(mid) {
  var m = S.media.filter(function (x) { return x.id === mid; })[0];
  if (!m) return;
  lbMid = mid;
  var url = URL.createObjectURL(m.blob);
  var img = $('#lbimg');
  var oldUrl = img.getAttribute('data-url');
  if (oldUrl) URL.revokeObjectURL(oldUrl);
  img.src = url;
  img.setAttribute('data-url', url);
  $('#lbcap').textContent = nameOf(m.item) + ' · ' + tfmt(m.t);
  $('#lightbox').hidden = false;
  pushLayer('lb', mid);
}
function visualCloseLightbox() {
  var img = $('#lbimg');
  var oldUrl = img.getAttribute('data-url');
  if (oldUrl) { URL.revokeObjectURL(oldUrl); img.removeAttribute('data-url'); }
  img.src = '';
  $('#lightbox').hidden = true;
  lbMid = null;
}
function requestCloseLightbox() {
  if (lbMid == null) return;
  visualCloseLightbox();
  popLayerViaUI();
}
function lightboxDelete() {
  if (lbMid == null) return;
  var m = S.media.filter(function (x) { return x.id === lbMid; })[0];
  if (!m || !confirm('删掉这张照片？')) return;
  if (mediaURL[lbMid]) { URL.revokeObjectURL(mediaURL[lbMid]); delete mediaURL[lbMid]; }
  S.media = S.media.filter(function (x) { return x.id !== lbMid; });
  dbDel('media', lbMid).then(function () {
    renderThumbs(m.item);
    requestCloseLightbox();
  });
}

/* ================= 时间驱动配色（7.2） =================
   底色与强调色按真实时钟在暖昼/冷夜两组端点间插值：
   13:00 入馆偏暖日光调 → 午后极缓转冷 → 18:00 起入夜 → 19:00 闭馆最深，
   夜里保持最深，清晨 5:00–7:30 回暖。每分钟挪一点，不做开关、提示、动画。 */
var DAYNIGHT = {
  warm: { bg:'#12100E', card:'#1A1815', 'float':'#221F1B',
          ink:'#D9D3C7', ink2:'#A89F8E', ink3:'#6E6759',
          silver:'#9FB0C4', amber:'#B9893F',
          cobalt:'#3E66EA', 'cobalt-hi':'#6C8CF5', must:'#DAD4C8' },
  deep: { bg:'#0D0E12', card:'#15161B', 'float':'#1C1E24',
          ink:'#C9CDD6', ink2:'#98A0AD', ink3:'#646B78',
          silver:'#A8B9CE', amber:'#AE8C51',
          cobalt:'#4A6FF2', 'cobalt-hi':'#7D97F7', must:'#CDD1D8' }
};
var T_STOPS = [[5, 1], [7.5, 0], [13, 0], [18, .45], [19, 1]];  // [时, 冷度]
function coolness(h) {
  if (h < T_STOPS[0][0]) return 1;
  for (var i = 1; i < T_STOPS.length; i++) {
    if (h <= T_STOPS[i][0]) {
      var a = T_STOPS[i - 1], b = T_STOPS[i];
      return a[1] + (b[1] - a[1]) * (h - a[0]) / (b[0] - a[0]);
    }
  }
  return 1;
}
function hexRGB(x) {
  return [parseInt(x.slice(1, 3), 16), parseInt(x.slice(3, 5), 16), parseInt(x.slice(5, 7), 16)];
}
function mixHex(a, b, t) {
  var A = hexRGB(a), B = hexRGB(b), s = '#';
  for (var i = 0; i < 3; i++) {
    var v = Math.round(A[i] + (B[i] - A[i]) * t);
    s += (v < 16 ? '0' : '') + v.toString(16);
  }
  return s;
}
var tcMeta = document.querySelector('meta[name="theme-color"]');
function applyClock() {
  var d = new Date();
  var t = coolness(d.getHours() + d.getMinutes() / 60);
  var st = document.documentElement.style;
  for (var k in DAYNIGHT.warm) {
    st.setProperty('--' + k, mixHex(DAYNIGHT.warm[k], DAYNIGHT.deep[k], t));
  }
  var ink = hexRGB(mixHex(DAYNIGHT.warm.ink, DAYNIGHT.deep.ink, t));
  st.setProperty('--lift', 'rgba(' + ink.join(',') + ',.055)');
  st.setProperty('--lift2', 'rgba(' + ink.join(',') + ',.10)');
  var sv = hexRGB(mixHex(DAYNIGHT.warm.silver, DAYNIGHT.deep.silver, t));
  st.setProperty('--grid', 'rgba(' + sv.join(',') + ',.34)');
  if (tcMeta) tcMeta.setAttribute('content', mixHex(DAYNIGHT.warm.bg, DAYNIGHT.deep.bg, t));
}
applyClock();
setInterval(applyClock, 60000);

function boot() {
  document.title = MUSEUM.name + ' · 展厅导览';
  $('#tl-l').textContent = MUSEUM.name + ' · ' + MUSEUM.dateShort;
  $('#tl-r').textContent = MUSEUM.hours;
  openDB().then(hydrate).then(function () {
    buildMinimap();
    renderList();
    renderFooter();
    renderQref();
    buildIndex();
    bindSheetDrag();
    bindMorphDriver();
    S.doubts.forEach(function (d) {
      var btn = $('#it-' + d.item + ' .a-doubt');
      if (btn) btn.classList.add('on');
    });
    if (IS_FILE || mem) {
      var bar = $('#warnbar');
      bar.hidden = false;
      $('#warntx').textContent = mem
        ? '存储不可用：本次记录只在内存里，切走可能就没了——随手导出。'
        : '本地文件模式：iOS 可能清掉这里存的照片和笔记，逛完务必导出。';
    }
    if (!S.seen) {
      $('#bannerslot').innerHTML = '<div class="banner"><div class="bx">' +
        '<p>照片、笔记、勾选都只存在这台手机上。用 Safari 打开的话，先点分享 →「添加到主屏幕」，从主屏进来用；' +
        '相机和麦克风在第一次用到时会各弹一次系统询问，允许就行。逛完在「手记」里导出参观志。</p>' +
        '<button data-cmd="banner-ok">知道了</button></div></div>';
    }
    syncHd();
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
    if (IS_HTTP && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function () {
        swState = 'active';
      }).catch(function () {
        swState = 'fail';
      });
    }
  });
}
boot();
